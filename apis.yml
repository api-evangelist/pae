name: PAE
description: |-
  PAE (Pacific Architects and Engineers) was a U.S. federal services contractor
  providing mission support, training, intelligence, and infrastructure services
  to U.S. government agencies and allied governments. Founded in 1955, PAE was
  publicly traded on NASDAQ under ticker symbol "PAE" until its acquisition by
  Amentum on February 15, 2022, in an all-cash transaction valued at
  approximately $1.9 billion (including assumed debt). PAE was fully absorbed
  into Amentum and no longer operates as a standalone brand. The pae.com domain
  now redirects to Amentum properties. PAE never published a public developer
  program, API portal, OpenAPI specifications, SDKs, or any public-facing
  technical APIs — its business was federal services delivery, not software or
  platforms. This profile is maintained for historical completeness within the
  API Evangelist network registry.
